name: Build EyesMobileWidget APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Extract stable build source
        shell: bash
        run: unzip -o EyesMobileWidget-mobile-build.zip

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'
          validate-wrappers: false
          cache-provider: basic

      - name: Ensure Android SDK 34
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare stable APK
        shell: bash
        run: cp app/build/outputs/apk/debug/app-debug.apk EyesMobileWidget-final.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyesMobileWidget-final-apk
          path: EyesMobileWidget-final.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f EyesMobileWidget-final.apk
          if ! git diff --cached --quiet; then
            git commit -m "Update EyesMobileWidget-final.apk [skip ci]"
            git push
          fi
