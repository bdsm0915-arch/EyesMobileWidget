name: Build EyesMobileWidget APK


on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]


jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write


    steps:
      - name: Checkout source
        uses: actions/checkout@v6


      - name: Extract uploaded build source
        shell: bash
        run: unzip -o EyesMobileWidget-v10.5-mobile-build.zip


      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2.1'
          validate-wrappers: false
          cache-provider: basic


      - name: Ensure Android SDK 34
        shell: bash
