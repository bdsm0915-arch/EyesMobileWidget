name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: unzip -o EyesMobileWidget-mobile-build.zip

      - name: Build APK
        run: |
          if [ -d "EyesMobileWidget" ]; then
            cd EyesMobileWidget
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EyesMobileWidget-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            EyesMobileWidget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
